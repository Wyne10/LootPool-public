name: Deploy plugin

on:
  workflow_dispatch:
    inputs:
      deploy-path:
        description: 'Path to deploy artifacts to'
        default: 'build'
        required: true
        type: string
        
jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy via SSH
        uses: garygrossgarten/github-action-scp@0.9.0
        with:
          local: build/libs/
          remote: ${{ inputs.deploy-path }}
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
